spring.application.name=smart-community

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/smartcommunity
spring.datasource.username=postgres
spring.datasource.password=sm123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Demo accounts are opt-in. Normal operation provisions staff and residents through APIs.
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}

# Bootstrap exactly one administrator. Override these values through environment variables outside development.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:Bootstrap Administrator}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@test.com}
app.bootstrap-admin.initial-password=${APP_BOOTSTRAP_ADMIN_INITIAL_PASSWORD:123456}

# Development-only fallback. Set APP_JWT_SECRET to a strong secret in deployed environments.
app.jwt.secret=${APP_JWT_SECRET:smart-community-development-only-secret-change-me-32-bytes}
app.jwt.expiration-seconds=7200
